name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate app icon
        run: |
          pip install pillow
          python make_icon.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Echo.app Payload/
          zip -qry Echo.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Echo-IPA
          path: Echo.ipa
          if-no-files-found: error
