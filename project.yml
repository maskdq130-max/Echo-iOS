name: Echo
options:
  bundleIdPrefix: com.echoplayer
  deploymentTarget:
    iOS: "15.0"

targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: Assets.xcassets
      - path: index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoplayer.app
        PRODUCT_NAME: Echo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Эхо"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Чтобы выбирать звуки, гифки и обложки из галереи"
        NSCameraUsageDescription: "Нужна, если выбрать фото или видео прямо с камеры"
        NSMicrophoneUsageDescription: "Нужен, если снять видео прямо с камеры"
